PLG_TASK_JED="JED - Queue Tasks"
PLG_TASK_JED_UPDATECHECK="JED - Check Extension Updates"
PLG_TASK_JED_QUEUEWORKER="JED - Process Queue"
PLG_TASK_JED_LABEL_BATCH_SIZE="Batch Size"
PLG_TASK_JED_LABEL_QUEUE_BATCH_SIZE="Batch Size"
PLG_TASK_JED_LABEL_FORCE="Force Recheck"
PLG_TASK_JED_LABEL_FORCE_DESC="Ignore the recently-checked cooldown and re-check every eligible extension."
PLG_TASK_JED_LABEL_JOB_TIMEOUT="Job Timeout (seconds)"
PLG_TASK_JED_LABEL_JOB_TIMEOUT_DESC="Jobs still 'running' past this many seconds are assumed crashed and reclaimed."
PLG_TASK_JED_LINKCHECK="JED - Check Extension Links"
PLG_TASK_JED_LINKCHECK_BATCH_SIZE_DESC="How many links to check per run. 200 every 30 minutes rotates the whole catalogue in about three days; raising it shortens that and raises the load on the sites being checked in equal measure."
PLG_TASK_JED_LINKCHECK_FORCE_DESC="Ignore the three-day interval and take the least recently checked links regardless. For a one-off sweep, not for normal operation."
PLG_TASK_JED_UPDATECHECK_TITLE="JED - Check Extension Updates"
PLG_TASK_JED_UPDATECHECK_DESC="Polls each listing's declared update server and applies any newer version it advertises."
PLG_TASK_JED_QUEUEWORKER_TITLE="JED - Process Queue"
PLG_TASK_JED_QUEUEWORKER_DESC="Drains a batch of queued JED jobs of any type - audits, score recalculations, on-demand link checks."
PLG_TASK_JED_LINKCHECK_TITLE="JED - Check Extension Links"
PLG_TASK_JED_LINKCHECK_DESC="Checks the URLs on public listings in rotation, counts consecutive failures, opens a ticket for the developer, and flags a listing left unattended."
PLG_TASK_JED_HITAGGREGATE="JED - Aggregate Hit Statistics"
PLG_TASK_JED_HITAGGREGATE_TITLE="JED - Aggregate Hit Statistics"
PLG_TASK_JED_HITAGGREGATE_DESC="Rolls the raw hit log into daily per-listing buckets and removes raw rows past the retention period. Run once a day."
PLG_TASK_JED_LABEL_DAYS="Days to Recompute"
PLG_TASK_JED_HITAGGREGATE_DAYS_DESC="How many days back to recompute. Two is right for a daily run: a day is only complete once it is over, and a missed run repairs itself."
PLG_TASK_JED_PRIVACYPRUNE="JED - Apply Privacy Retention"
PLG_TASK_JED_PRIVACYPRUNE_TITLE="JED - Apply Privacy Retention"
PLG_TASK_JED_PRIVACYPRUNE_DESC="Removes the personal data that has reached the end of its retention period, whether or not anybody asked: the address a review was submitted from, the ownership-transfer lookup log, and old form-time URL checks. Run once a day."
PLG_TASK_JED_PRIVACYPRUNE_REVIEW_IP_DAYS="Review Address Retention (days)"
PLG_TASK_JED_PRIVACYPRUNE_REVIEW_IP_DAYS_DESC="After this many days the address a review was submitted from is blanked; the review itself stays. The address exists to tell a genuine review from a ring of them, and that question is about a burst, not about last year. 0 keeps them indefinitely."
PLG_TASK_JED_PRIVACYPRUNE_LOOKUP_DAYS="Transfer Lookup Retention (days)"
PLG_TASK_JED_PRIVACYPRUNE_LOOKUP_DAYS_DESC="After this many days a recipient-lookup record is deleted. The rate limit itself only reads the last 24 hours; the rest of the window exists so a pattern of repeated probing stays visible. 0 keeps them indefinitely."
PLG_TASK_JED_PRIVACYPRUNE_URL_CHECK_DAYS="URL Check Retention (days)"
PLG_TASK_JED_PRIVACYPRUNE_URL_CHECK_DAYS_DESC="After this many days a form-time URL check is deleted. The durable link state lives in the link health table, not here. 0 keeps them indefinitely."
