PLG_ACTIONLOG_JED="Action Log - JED"
PLG_ACTIONLOG_JED_XML_DESCRIPTION="Records administrative decisions of the Joomla Extensions Directory in the core action log: moderation verdicts, blocks, deletions, forced ownership transfers, maintainer and privilege changes, review moderation, ticket handling and link state changes. Routine automated runs are not recorded."

; Listing moderation and state (P1-01, P1-02)
PLG_ACTIONLOG_JED_EXTENSION_APPROVE="User <a href='{accountlink}'>{username}</a> approved the listing <a href='{itemlink}'>{title}</a>"
PLG_ACTIONLOG_JED_EXTENSION_REJECT="User <a href='{accountlink}'>{username}</a> rejected the listing <a href='{itemlink}'>{title}</a> - {reason}"
PLG_ACTIONLOG_JED_EXTENSION_BLOCK="User <a href='{accountlink}'>{username}</a> blocked the listing <a href='{itemlink}'>{title}</a> - {reason}"
PLG_ACTIONLOG_JED_EXTENSION_UNBLOCK="User <a href='{accountlink}'>{username}</a> lifted the block on the listing <a href='{itemlink}'>{title}</a>"
PLG_ACTIONLOG_JED_EXTENSION_DELETE="User <a href='{accountlink}'>{username}</a> deleted the listing <a href='{itemlink}'>{title}</a>"
PLG_ACTIONLOG_JED_EXTENSION_RESTORE="User <a href='{accountlink}'>{username}</a> restored the deleted listing <a href='{itemlink}'>{title}</a>"

; Ownership and maintainers (P1-03, P1-04)
PLG_ACTIONLOG_JED_TRANSFER_FORCE="User <a href='{accountlink}'>{username}</a> transferred the listing <a href='{itemlink}'>{title}</a> from <a href='{fromlink}'>{from}</a> to <a href='{tolink}'>{to}</a> without the owner's confirmation - {reason}"
PLG_ACTIONLOG_JED_MAINTAINER_ADD="User <a href='{accountlink}'>{username}</a> invited <a href='{maintainerlink}'>{maintainer}</a> as a maintainer of <a href='{itemlink}'>{title}</a>"
PLG_ACTIONLOG_JED_MAINTAINER_REMOVE="User <a href='{accountlink}'>{username}</a> removed <a href='{maintainerlink}'>{maintainer}</a> as a maintainer of <a href='{itemlink}'>{title}</a>"

; Review moderation (P1-02, P1-06)
PLG_ACTIONLOG_JED_REVIEW_PUBLISH="User <a href='{accountlink}'>{username}</a> published the review <a href='{itemlink}'>{title}</a> of {extension}"
PLG_ACTIONLOG_JED_REVIEW_UNPUBLISH="User <a href='{accountlink}'>{username}</a> unpublished the review <a href='{itemlink}'>{title}</a> of {extension}"
PLG_ACTIONLOG_JED_RESPONSE_PUBLISH="User <a href='{accountlink}'>{username}</a> published the developer response to the review <a href='{itemlink}'>{title}</a> of {extension}"
PLG_ACTIONLOG_JED_RESPONSE_UNPUBLISH="User <a href='{accountlink}'>{username}</a> unpublished the developer response to the review <a href='{itemlink}'>{title}</a> of {extension}"

; Tickets (com_tickets)
PLG_ACTIONLOG_JED_TICKET_ASSIGN="User <a href='{accountlink}'>{username}</a> assigned the ticket <a href='{itemlink}'>{title}</a> to <a href='{assigneelink}'>{assignee}</a>"
PLG_ACTIONLOG_JED_TICKET_UNASSIGN="User <a href='{accountlink}'>{username}</a> took the ticket <a href='{itemlink}'>{title}</a> away from <a href='{assigneelink}'>{assignee}</a>"
PLG_ACTIONLOG_JED_TICKET_CLOSE="User <a href='{accountlink}'>{username}</a> set the ticket <a href='{itemlink}'>{title}</a> to {status}"
PLG_ACTIONLOG_JED_TICKET_REOPEN="User <a href='{accountlink}'>{username}</a> reopened the ticket <a href='{itemlink}'>{title}</a>, now {status}"

; Privileges, bans and trust (P1-05)
PLG_ACTIONLOG_JED_USER_BAN="User <a href='{accountlink}'>{username}</a> banned <a href='{itemlink}'>{title}</a> {period} - {reason}"
PLG_ACTIONLOG_JED_USER_UNBAN="User <a href='{accountlink}'>{username}</a> lifted the ban on <a href='{itemlink}'>{title}</a> - {reason}"
PLG_ACTIONLOG_JED_USER_TRUST_GRANT="User <a href='{accountlink}'>{username}</a> granted <a href='{itemlink}'>{title}</a> trusted status for {scope} - {reason}"
PLG_ACTIONLOG_JED_USER_TRUST_REVOKE="User <a href='{accountlink}'>{username}</a> revoked trusted status for {scope} from <a href='{itemlink}'>{title}</a> - {reason}"
PLG_ACTIONLOG_JED_USER_PRIVILEGE="User <a href='{accountlink}'>{username}</a> changed the privileges of <a href='{itemlink}'>{title}</a>: {changes} - {reason}"

; Link health (P1-09) - transitions only, never routine runs
PLG_ACTIONLOG_JED_LINK_BROKEN="The {field} of <a href='{itemlink}'>{title}</a> stopped answering - {detail}"
PLG_ACTIONLOG_JED_LINK_RECOVERED="The {field} of <a href='{itemlink}'>{title}</a> is answering again"
