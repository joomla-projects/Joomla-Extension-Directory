PLG_PRIVACY_JED="Privacy - JED"
PLG_PRIVACY_JED_XML_DESCRIPTION="Serves export and erasure requests for the Joomla Extensions Directory: listings, maintainer roles, reviews, favourites, ownership transfers and the per-user privilege and ban records."

PLG_PRIVACY_JED_FIELD_REVIEW_HANDLING_LABEL="Reviews on an erasure request"
PLG_PRIVACY_JED_FIELD_REVIEW_HANDLING_DESC="A review is both the reviewer's words and one of the numbers an extension's public score is made of. Anonymising removes the author and the submission address and leaves the rating standing; deleting removes the review and recalculates every affected extension's score. Anonymising is the default because deleting silently changes a rating other people relied on."
PLG_PRIVACY_JED_FIELD_REVIEW_HANDLING_ANONYMISE="Anonymise - keep the review, remove the author"
PLG_PRIVACY_JED_FIELD_REVIEW_HANDLING_DELETE="Delete - remove the review and recalculate scores"

PLG_PRIVACY_JED_CAPABILITY_SOFT_DELETE="Soft-deleted listings are not a hiding place. A listing the JED team has removed from the site keeps its row so the backend can still read it, and every export and erasure in this component covers those rows and their revision history exactly as it covers live ones."
PLG_PRIVACY_JED_CAPABILITY_RETENTION="Some data is removed on a timer rather than on request: the address a review was submitted from after 180 days, the ownership-transfer lookup log after 90 days, form-time URL checks after a year, and raw hit records after 30 days. The scheduled task 'JED: privacy retention' applies the first three; hit records are pruned by the hit aggregation task."
