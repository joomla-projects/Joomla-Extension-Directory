PLG_PRIVACY_VEL="Privacy - VEL"
PLG_PRIVACY_VEL_XML_DESCRIPTION="Exports and erases what the Vulnerable Extension List holds about a person: reports, case correspondence, attachments and credits - by account and by e-mail address."
PLG_PRIVACY_VEL_CAPABILITY_REPORTS="Vulnerability reports and fix notices, with the reporter's name, e-mail address, organisation and consent record."
PLG_PRIVACY_VEL_CAPABILITY_MESSAGES="Case correspondence between reporters, vendors and the VEL team."
PLG_PRIVACY_VEL_CAPABILITY_ATTACHMENTS="Files attached to reports and messages, stored outside the web root."
PLG_PRIVACY_VEL_CAPABILITY_CREDITS="Public credits on advisories, which name a person only at their request."
PLG_PRIVACY_VEL_CAPABILITY_IP="Network addresses are stored only as a keyed hash, for rate limiting; the address itself is never kept."
PLG_PRIVACY_VEL_CAPABILITY_RETENTION="Unverified guest reports are deleted automatically after the configured number of days. Erasure anonymises the person and deletes their attachments while keeping the disclosure record."
