PLG_PRIVACY_TICKETS="Privacy - JED Tickets"
PLG_PRIVACY_TICKETS_XML_DESCRIPTION="Serves export and erasure requests for the JED ticket system: the tickets a person opened, the messages they wrote, and the cases they were assigned."

PLG_PRIVACY_TICKETS_FIELD_HANDLING_LABEL="Tickets on an erasure request"
PLG_PRIVACY_TICKETS_FIELD_HANDLING_DESC="A ticket is correspondence with a person rather than a record about software, and nothing is computed from it, so deleting is the default. Anonymising keeps the thread and removes only the author reference - which leaves whatever the person typed into the message, including a signature or an address, in place."
PLG_PRIVACY_TICKETS_FIELD_HANDLING_DELETE="Delete - remove the tickets and their messages"
PLG_PRIVACY_TICKETS_FIELD_HANDLING_ANONYMISE="Anonymise - keep the threads, remove the author"
