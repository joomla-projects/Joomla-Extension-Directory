; Ticket text
COM_ABANDONWARE_TICKET_SUBJECT="Possible abandonware: %s"
COM_ABANDONWARE_TICKET_BODY="An abandonware case has been opened.\n\nExtension: %1$s\nVersion: %2$s\nURL: %3$s\n\nWhy:\n%4$s\n\nBefore anything is marked, the owner has to be contacted and given a grace period."
COM_ABANDONWARE_TICKET_CLOSED="Abandonware case closed: %s"

; Mail template
COM_ABANDONWARE_OWNER_CONTACT_EMAIL_SUBJECT="Is {EXTENSIONNAME} still maintained?"
COM_ABANDONWARE_OWNER_CONTACT_EMAIL_BODY="Hello,\n\nThe {SITENAME} team is reviewing whether {EXTENSIONNAME} is still being maintained. This is not an accusation and nothing has been published - we would simply like to hear from you.\n\nWhat prompted this:\n{REASON}\n\nIf the extension is still maintained, please reply or update the listing by {GRACEUNTIL}. An extension with no recent release is not necessarily abandoned, and a short reply from you closes this straight away.\n\nIf we hear nothing by then, the listing may be marked as no longer maintained, and it may be offered for adoption by another maintainer.\n\nYour listing: {LISTINGLINK}\n\nRegards,\nThe {SITENAME} team"

; Configuration
COM_ABANDONWARE_CONFIG_WORKFLOW_FIELDSET_LABEL="Workflow"
COM_ABANDONWARE_CONFIG_GRACE_DAYS_LABEL="Grace period (days)"
COM_ABANDONWARE_CONFIG_GRACE_DAYS_DESC="How long a developer has to answer before a case can move on. A policy decision, not a technical one: this is the time somebody gets to notice an email before something is said in public about their product."
COM_ABANDONWARE_CONFIG_AUTO_CONTACT_LABEL="Contact owners automatically"
COM_ABANDONWARE_CONFIG_AUTO_CONTACT_DESC="Reserved. The contact attempt is deliberately a human action for now - it is the step that decides whether the automation was right, and automating it removes the check."
COM_ABANDONWARE_CONFIG_AUTO_PUBLISH_LABEL="Publish marked cases by default"
COM_ABANDONWARE_CONFIG_AUTO_PUBLISH_DESC="Whether marking a case as abandoned also puts it on the public list unless told otherwise. Off is the cautious setting and the recommended one."

COM_ABANDONWARE_CONFIG_SIGNALS_FIELDSET_LABEL="Automated signals"
COM_ABANDONWARE_CONFIG_SIGNAL_LINKCHECK_LABEL="Dead links"
COM_ABANDONWARE_CONFIG_SIGNAL_LINKCHECK_DESC="Open a case when the periodic link check has flagged a listing as left unattended by its developer."
COM_ABANDONWARE_CONFIG_SIGNAL_UPDATECHECK_LABEL="Failing update server"
COM_ABANDONWARE_CONFIG_SIGNAL_UPDATECHECK_DESC="Open a case when a listing's update server has been failing for longer than the tolerance below."
COM_ABANDONWARE_CONFIG_UPDATECHECK_DAYS_LABEL="Update server tolerance (days)"
COM_ABANDONWARE_CONFIG_UPDATECHECK_DAYS_DESC="How long an update server may keep failing before it counts. A single failed poll is a hoster having an afternoon; what says something about maintenance is the duration."
COM_ABANDONWARE_CONFIG_SIGNAL_INACTIVITY_LABEL="Long inactivity"
COM_ABANDONWARE_CONFIG_SIGNAL_INACTIVITY_DESC="Open a case when nothing has changed on a listing for a very long time. Off by default: this is the weakest of the three signals, and on a catalogue this size switching it on before choosing the threshold produces more cases than anyone can read."
COM_ABANDONWARE_CONFIG_INACTIVITY_DAYS_LABEL="Inactivity threshold (days)"
COM_ABANDONWARE_CONFIG_INACTIVITY_DAYS_DESC="How long a listing may go untouched before it counts as inactive. A policy number with commercial consequences - an extension may simply be finished."
COM_ABANDONWARE_CONFIG_SCAN_BATCH_LABEL="Signals per scan"
COM_ABANDONWARE_CONFIG_SCAN_BATCH_DESC="How many listings each signal considers per scheduled run."
