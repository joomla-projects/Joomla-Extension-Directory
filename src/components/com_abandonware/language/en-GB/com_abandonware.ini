COM_ABANDONWARE="Abandoned Extensions"

COM_ABANDONWARE_LIST_HEADING="Abandoned Extensions"
COM_ABANDONWARE_LIST_INTRO="These extensions appear to be no longer maintained. Each entry got here the same way: something suggested the extension had gone quiet - broken links, an update server that stopped answering, a long silence, or a report from a member of the public - the JED team wrote to the developer, and nobody answered within the grace period. This says nothing about whether an extension is insecure, and it is not the vulnerable extensions list."
COM_ABANDONWARE_LIST_EMPTY="No extensions are currently listed as abandoned."

