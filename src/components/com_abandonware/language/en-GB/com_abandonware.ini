COM_ABANDONWARE_REPORT_HEADING="Report an Abandoned Extension"
COM_ABANDONWARE_REPORT_INTRO="Use this form to tell the JED team about an extension that appears to be no longer maintained. Please note that an extension with no recent release is not necessarily abandoned - it may simply be finished. What is useful to us is evidence that the developer has become unreachable: support that goes unanswered, a download that no longer works, a site that has gone. We always write to the developer before anything is published."
COM_ABANDONWARE_REPORT_LEGEND_SUBJECT="Which extension"
COM_ABANDONWARE_REPORT_LEGEND_REPORTER="About you"
COM_ABANDONWARE_REPORT_EXTENSION_NAME_DESC="The name of the extension, as it appears in the directory if it is listed."
COM_ABANDONWARE_REPORT_EXTENSION_VERSION_DESC="The most recent version you are aware of, if you know it."
COM_ABANDONWARE_REPORT_EXTENSION_URL_DESC="The developer's site or the extension's page, if you have it."
COM_ABANDONWARE_REPORT_DEVELOPER_NAME_DESC="Who publishes the extension, if you know."
COM_ABANDONWARE_REPORT_REASON_DESC="What makes you think it is no longer maintained. Concrete details help most: unanswered support requests with dates, a download link that fails, a domain that has expired."
COM_ABANDONWARE_REPORT_REPORTER_ORGANISATION_DESC="Optional. Only if you are reporting on behalf of an organisation."
