COM_JED_LINKCHECK_EMAIL_BODY="Hello,\n\nthe {LINKTYPE} on your extension \"{EXTENSIONNAME}\" has not answered our last few checks.\n\nAddress: {URL}\nWhat we saw: {REASON}\nFirst failed: {SINCE}\n\nWe check each link every few days and only write once several checks in a row have failed, so this is unlikely to be a passing outage. If the address has changed, please update it on your listing.\n\nWe have opened a ticket for this so you can reply in one place:\n{TICKETLINK}\n\nIt closes by itself once the link answers again.\n\n{SITENAME}"

