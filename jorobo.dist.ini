extension = jed
version = 4.0.0
source = src
target = package

; Developer-only settings.
;
; allow_schema_reset arms `robo schema:reset <joomla-path>`, which drops every JED table in the
; target installation and recreates it from install.mysql.utf8.sql. That is the old reset
; workflow - the DROP statements are no longer part of the install, so a reinstall or an
; uninstall can no longer destroy the catalogue.
;
; Leave this at 0. Turn it on only in your own jorobo.ini, which is not in the repository and is
; not reachable from any web UI. There is deliberately no component parameter for this.
[dev]
allow_schema_reset = 0

; Create a pre-release of the extension on GitHub
; Add your personal GitHub access tocken
; and add Release to the target (separated by space) above
[github]
remote = origin
branch = develop
token =
owner = joomla-projects
repository = Joomla-Extension-Directory
changelog_source = commits

; Automatic upload of the built extension package to an FTP server
[ftp]
host =
port = 21
user =
password =
ssl = false
target = /

; Adds / replaces copyright headers at the beginning of files in the source folder
[header]
files = php,js
exclude =
text = "
/**
 * @package     Joomla.Administrator
 * @subpackage  JED
 *
 * @copyright   (C) 2022 Open Source Matters, Inc. <https://www.joomla.org>
 * @license     GNU General Public License version 2 or later; see LICENSE.txt
 */
"
